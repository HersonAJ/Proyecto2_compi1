<div class="barra">
    <div class="logo">
        <span class="marca">YFERA</span>
        <span class="subtitulo">Framework</span>
    </div>
    <nav class="acciones">
        <label class="boton color-label" title="Selector de color para .styles">
            Color
            <input type="color" class="color-input" (change)="onColorChange($event)" />
        </label>
        <button class="boton" (click)="onIndentar()">Indentar</button>
        <button class="boton" (click)="onLimpiar()">Limpiar errores</button>
        <button class="boton" (click)="onDescargarProyecto()">Descargar Proyecto</button>
        <button class="boton primario" (click)="onAnalizar()">Analizar</button>
    </nav>
</div>
